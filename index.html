<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workloung · AtivGreen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0A0A0A;
      --surface-1:   #141414;
      --surface-2:   #1E1E1E;
      --surface-3:   #272727;
      --border:      rgba(255,255,255,0.07);
      --border-md:   rgba(255,255,255,0.13);
      --primary:     #00C853;
      --primary-glow:rgba(0,200,83,0.14);
      --primary-lt:  #69F0AE;
      --accent:      #00E676;
      --amber:       #FFD740;
      --amber-glow:  rgba(255,215,64,0.12);
      --red:         #FF5252;
      --text-1:      #FFFFFF;
      --text-2:      rgba(255,255,255,0.60);
      --text-3:      rgba(255,255,255,0.30);
      --radius:      12px;
      --radius-sm:   8px;
    }

    html { font-family: 'Inter', -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
      line-height: 1.5;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 58px;
      background: var(--surface-1);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      flex-shrink: 0;
    }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 15px; color: #000;
    }
    .logo-brand { font-size: 15px; font-weight: 700; letter-spacing: -.3px; }
    .logo-sub   { font-size: 10px; font-weight: 600; color: var(--primary); letter-spacing: 1.4px; text-transform: uppercase; }

    .header-title { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .4px; }

    .btn-gdrive {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border-md);
      border-radius: var(--radius-sm);
      color: var(--text-2); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all .2s;
    }
    .btn-gdrive:hover { border-color: var(--primary); color: var(--primary); }
    .btn-gdrive.ok   { border-color: var(--primary); color: var(--primary); }
    .gdot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); transition: background .3s; }
    .gdot.on { background: var(--primary); }

    /* ── LAYOUT ── */
    .layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 58px); }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 256px; flex-shrink: 0;
      background: var(--surface-1);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-top { padding: 14px 12px 10px; border-bottom: 1px solid var(--border); }
    .sidebar-label { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 10px; padding-left: 4px; }

    .search {
      width: 100%; padding: 8px 11px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-1); font-size: 13px; font-family: inherit; outline: none; transition: border .2s;
    }
    .search::placeholder { color: var(--text-3); }
    .search:focus { border-color: var(--primary); }

    .client-list { flex: 1; overflow-y: auto; padding: 8px; }

    .c-item {
      padding: 10px 11px; border-radius: var(--radius-sm);
      cursor: pointer; transition: background .15s;
      margin-bottom: 2px; border: 1px solid transparent;
    }
    .c-item:hover { background: var(--surface-2); }
    .c-item.sel { background: var(--primary-glow); border-color: rgba(0,200,83,.25); }
    .c-name  { font-size: 13px; font-weight: 600; color: var(--text-1); margin-bottom: 2px; }
    .c-co    { font-size: 11px; color: var(--text-3); }
    .c-badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 700;
      margin-top: 5px;
    }
    .b-pend { background: rgba(255,255,255,.06); color: var(--text-3); }
    .b-actv { background: var(--amber-glow); color: var(--amber); }
    .b-done { background: var(--primary-glow); color: var(--primary); }

    .sidebar-foot { padding: 11px; border-top: 1px solid var(--border); }
    .btn-new {
      width: 100%; padding: 10px;
      background: var(--primary); border: none; border-radius: var(--radius-sm);
      color: #000; font-size: 13px; font-weight: 800;
      cursor: pointer; transition: all .2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-new:hover { background: var(--accent); transform: translateY(-1px); }

    /* ── MAIN ── */
    .main { flex: 1; overflow-y: auto; background: var(--bg); }

    /* ── EMPTY ── */
    .empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 14px; color: var(--text-3);
      text-align: center;
    }
    .empty-icon { font-size: 48px; }
    .empty h2 { font-size: 18px; font-weight: 700; color: var(--text-2); }
    .empty p  { font-size: 13px; max-width: 280px; line-height: 1.7; }

    /* ── CLIENT DETAIL ── */
    .detail { padding: 28px 32px; max-width: 860px; }

    .det-head {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 24px;
    }
    .det-head h1 { font-size: 22px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 5px; }
    .det-meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--text-2); font-size: 12px; }
    .det-meta span { color: var(--text-3); margin-right: 3px; }

    .btn-edit {
      padding: 7px 15px;
      background: var(--surface-2); border: 1px solid var(--border-md);
      border-radius: var(--radius-sm); color: var(--text-2);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .btn-edit:hover { border-color: var(--primary); color: var(--primary); }

    /* ── STATS ROW ── */
    .stats { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin-bottom: 22px; }
    .stat {
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 10px; text-align: center;
    }
    .stat-n { font-size: 22px; font-weight: 800; line-height: 1; }
    .stat-l { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .6px; margin-top: 4px; }

    /* ── TIMELINE CARD ── */
    .tl-card {
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px 24px; margin-bottom: 22px;
    }
    .tl-card-title { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 22px; }

    .timeline { position: relative; }
    .tl-track {
      position: absolute; top: 19px; left: 19px; right: 19px;
      height: 2px; background: var(--border); z-index: 0;
    }
    .tl-fill { height: 100%; background: var(--primary); border-radius: 1px; transition: width .5s ease; }

    .tl-steps { display: flex; justify-content: space-between; position: relative; z-index: 1; }
    .tl-step  { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; flex: 1; }

    .tl-circle {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; border: 2px solid var(--border);
      background: var(--surface-2); transition: all .3s;
    }
    .tl-circle.done {
      background: var(--primary); border-color: var(--primary); color: #000; font-weight: 800;
      box-shadow: 0 0 16px rgba(0,200,83,.35);
    }
    .tl-circle.actv {
      border-color: var(--amber); color: var(--amber);
      box-shadow: 0 0 14px rgba(255,215,64,.28);
      animation: pulse-amber 2s ease-in-out infinite;
    }
    .tl-circle.pend { color: var(--text-3); }

    @keyframes pulse-amber {
      0%,100% { box-shadow: 0 0 14px rgba(255,215,64,.25); }
      50%      { box-shadow: 0 0 22px rgba(255,215,64,.45); }
    }

    .tl-label { font-size: 10px; font-weight: 700; text-align: center; color: var(--text-3); max-width: 72px; line-height: 1.3; }
    .tl-label.done { color: var(--primary); }
    .tl-label.actv { color: var(--amber); }

    /* ── STAGE CARDS ── */
    .stages { display: flex; flex-direction: column; gap: 12px; }

    .stage {
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; transition: border-color .2s;
    }
    .stage.s-actv { border-color: rgba(255,215,64,.25); }
    .stage.s-done { border-color: rgba(0,200,83,.18); }

    .stage-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 18px; cursor: pointer; user-select: none; transition: background .15s;
    }
    .stage-head:hover { background: rgba(255,255,255,.02); }

    .stage-lft { display: flex; align-items: center; gap: 12px; }
    .stage-ico {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; background: var(--surface-2); flex-shrink: 0;
    }
    .stage-ico.done { background: rgba(0,200,83,.12); }
    .stage-ico.actv { background: rgba(255,215,64,.10); }

    .stage-ttl { font-size: 13px; font-weight: 700; }
    .stage-desc { font-size: 11px; color: var(--text-3); margin-top: 1px; }

    .pill {
      padding: 3px 10px; border-radius: 20px;
      font-size: 10px; font-weight: 700; letter-spacing: .3px;
    }
    .p-pend { background: rgba(255,255,255,.06); color: var(--text-3); }
    .p-actv { background: var(--amber-glow); color: var(--amber); }
    .p-done { background: var(--primary-glow); color: var(--primary); }

    .chev { color: var(--text-3); font-size: 16px; transition: transform .2s; }
    .chev.open { transform: rotate(180deg); }

    .stage-body {
      border-top: 1px solid var(--border);
      padding: 18px; display: none;
    }
    .stage-body.open { display: block; }

    .s-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .s-full { grid-column: 1 / -1; }

    .lbl {
      font-size: 10px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .9px;
      display: block; margin-bottom: 5px;
    }
    .inp, .sel, .ta {
      width: 100%; padding: 9px 11px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-1);
      font-size: 13px; font-family: inherit; outline: none; transition: border .2s;
    }
    .inp:focus, .sel:focus, .ta:focus { border-color: var(--primary); }
    .ta { min-height: 76px; resize: vertical; }
    .sel option { background: var(--surface-2); }

    .btn-save {
      padding: 8px 18px;
      background: var(--primary); border: none; border-radius: var(--radius-sm);
      color: #000; font-size: 13px; font-weight: 800;
      cursor: pointer; transition: all .2s;
    }
    .btn-save:hover { background: var(--accent); }

    /* ── UPLOAD ── */
    .upload-sec { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .upload-ttl { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .9px; margin-bottom: 10px; }

    .drop {
      border: 2px dashed var(--border-md); border-radius: var(--radius-sm);
      padding: 22px; text-align: center; cursor: pointer; transition: all .2s;
      margin-top: 10px;
    }
    .drop:hover, .drop.over { border-color: var(--primary); background: var(--primary-glow); }
    .drop-ico { font-size: 26px; margin-bottom: 6px; }
    .drop-txt { font-size: 12px; color: var(--text-2); }
    .drop-hint { font-size: 11px; color: var(--text-3); margin-top: 3px; }

    .file-list { display: flex; flex-direction: column; gap: 7px; }
    .f-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 13px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .f-left  { display: flex; align-items: center; gap: 10px; }
    .f-ico   { font-size: 18px; }
    .f-name  { font-size: 12px; font-weight: 600; color: var(--text-1); }
    .f-meta  { font-size: 10px; color: var(--text-3); margin-top: 1px; }
    .f-right { display: flex; align-items: center; gap: 7px; }

    .btn-drive-link {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px;
      background: var(--primary-glow); border: 1px solid rgba(0,200,83,.28);
      border-radius: 6px; color: var(--primary);
      font-size: 10px; font-weight: 700;
      cursor: pointer; text-decoration: none; transition: all .2s;
    }
    .btn-drive-link:hover { background: rgba(0,200,83,.22); }

    .btn-del {
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--text-3);
      cursor: pointer; border-radius: 6px; font-size: 16px; transition: all .2s;
    }
    .btn-del:hover { background: rgba(255,82,82,.1); color: var(--red); }

    .up-bar-wrap {
      margin-top: 9px; padding: 10px 13px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); display: none;
    }
    .up-bar-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-2); margin-bottom: 7px; }
    .up-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .up-bar-fill { height: 100%; background: var(--primary); transition: width .25s ease; }

    /* ── DASHBOARD ── */
    .dashboard { padding: 28px 32px; }
    .dash-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; }

    .dash-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-bottom: 24px; }
    .ds-card {
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; text-align: center;
    }
    .ds-ico  { font-size: 22px; margin-bottom: 4px; }
    .ds-num  { font-size: 26px; font-weight: 800; line-height: 1; }
    .ds-lbl  { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .6px; margin-top: 4px; }

    .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 14px; }
    .c-card {
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      cursor: pointer; transition: all .2s;
    }
    .c-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,200,83,.08); }

    .c-card-top { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
    .c-avatar {
      width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary) 0%, #005c25 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 15px; color: #000;
    }
    .c-card-n { font-size: 13px; font-weight: 700; }
    .c-card-co { font-size: 11px; color: var(--text-3); margin-top: 2px; }

    .mini-tl { display: flex; gap: 4px; }
    .mini-s { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
    .mini-s.done { background: var(--primary); }
    .mini-s.actv { background: var(--amber); }

    .c-card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; }
    .c-card-stage { font-size: 11px; color: var(--text-3); }
    .c-card-pct   { font-size: 11px; font-weight: 800; color: var(--primary); }

    /* ── MODAL ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.68);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; opacity: 0; pointer-events: none; transition: opacity .2s;
      backdrop-filter: blur(5px);
    }
    .overlay.on { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface-1); border: 1px solid var(--border-md);
      border-radius: 16px; width: 460px; max-width: calc(100vw - 24px);
      max-height: 85vh; overflow-y: auto;
      transform: translateY(18px); transition: transform .2s;
    }
    .overlay.on .modal { transform: translateY(0); }

    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px; border-bottom: 1px solid var(--border);
    }
    .modal-head h2 { font-size: 16px; font-weight: 800; }

    .btn-x {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: var(--surface-2); color: var(--text-2);
      border-radius: 7px; cursor: pointer; font-size: 17px; transition: all .2s;
    }
    .btn-x:hover { background: var(--surface-3); color: var(--text-1); }

    .modal-body { padding: 22px; display: flex; flex-direction: column; gap: 13px; }
    .modal-foot {
      display: flex; justify-content: flex-end; gap: 9px;
      padding: 14px 22px; border-top: 1px solid var(--border);
    }

    .btn-cancel {
      padding: 8px 18px;
      background: var(--surface-2); border: 1px solid var(--border-md);
      border-radius: var(--radius-sm); color: var(--text-2);
      font-size: 13px; font-weight: 600; cursor: pointer; transition: color .2s;
    }
    .btn-cancel:hover { color: var(--text-1); }

    /* ── TOAST ── */
    .toast-wrap { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 7px; z-index: 1000; }
    .toast {
      padding: 11px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 600; color: #000;
      display: flex; align-items: center; gap: 7px;
      animation: tin .28s ease; white-space: nowrap;
    }
    .toast.ok  { background: var(--primary); box-shadow: 0 4px 18px rgba(0,200,83,.3); }
    .toast.err { background: var(--red);     box-shadow: 0 4px 18px rgba(255,82,82,.3); color: #fff; }
    @keyframes tin { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── RESPONSIVE ── */
    @media (max-width: 720px) {
      .sidebar { width: 200px; }
      .stats   { grid-template-columns: repeat(3, 1fr); }
      .s-grid  { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .sidebar { display: none; }
      .detail  { padding: 16px; }
      .dashboard { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════ -->
<header class="header">
  <div class="logo">
    <div class="logo-mark">AG</div>
    <div>
      <div class="logo-brand">AtivGreen</div>
      <div class="logo-sub">Workloung</div>
    </div>
  </div>
  <div class="header-title">Painel de Feedback &amp; Workflow</div>
  <button class="btn-gdrive" id="btnGdrive" onclick="handleGAuth()">
    <span class="gdot" id="gdot"></span>
    <span id="gLabel">Conectar Google Drive</span>
  </button>
</header>

<!-- ══ LAYOUT ══════════════════════════════════════ -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-label">Clientes</div>
      <input class="search" id="srch" placeholder="Buscar…" oninput="filterClients(this.value)">
    </div>
    <div class="client-list" id="cList"></div>
    <div class="sidebar-foot">
      <button class="btn-new" onclick="openOverlay('oNew')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
        Novo Cliente
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main"></main>
</div>

<!-- ══ MODAL: Novo / Editar Cliente ══════════════════ -->
<div class="overlay" id="oNew">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Novo Cliente</h2>
      <button class="btn-x" onclick="closeOverlay('oNew')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="lbl">Nome do Cliente *</label>
        <input class="inp" id="fName" placeholder="Ex: João Silva">
      </div>
      <div class="form-group">
        <label class="lbl">Empresa</label>
        <input class="inp" id="fCo" placeholder="Ex: Empresa LTDA">
      </div>
      <div class="form-group">
        <label class="lbl">Projeto</label>
        <input class="inp" id="fProj" placeholder="Ex: Consultoria Q1 2024">
      </div>
      <div class="form-group">
        <label class="lbl">Responsável</label>
        <input class="inp" id="fOwner" placeholder="Ex: Maria Oliveira">
      </div>
      <div class="form-group">
        <label class="lbl">E-mail do Cliente</label>
        <input class="inp" type="email" id="fEmail" placeholder="cliente@empresa.com">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeOverlay('oNew')">Cancelar</button>
      <button class="btn-save" id="modalSaveBtn" onclick="saveClient()">Criar Cliente</button>
    </div>
  </div>
</div>

<!-- ══ TOASTS ══════════════════════════════════════ -->
<div class="toast-wrap" id="toasts"></div>

<!-- hidden file input -->
<input type="file" id="fileInput" style="display:none" multiple onchange="onFilesPicked(event)">

<script>
// ── CONFIG (fill in your Google Cloud credentials) ───────────────────────────
const G_CLIENT_ID  = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
const G_FOLDER_ID  = ''; // optional Drive folder ID for uploads

// ── STAGE DEFINITIONS ────────────────────────────────────────────────────────
const STAGES = [
  { id: 'form',    icon: '📋', label: 'Criação de Formulário',  desc: 'Elaboração do formulário de feedback',            hasUpload: false },
  { id: 'send',    icon: '📤', label: 'Envio',                  desc: 'Envio do formulário para o cliente',              hasUpload: false },
  { id: 'reply',   icon: '📥', label: 'Resposta',               desc: 'Recebimento e upload da resposta de feedback',    hasUpload: true  },
  { id: 'plan',    icon: '📊', label: 'Plano de Ação',          desc: 'Elaboração do plano baseado no feedback',         hasUpload: false },
  { id: 'exec',    icon: '⚡', label: 'Execução',               desc: 'Execução e acompanhamento do plano de ação',     hasUpload: false },
];

// ── STATE ────────────────────────────────────────────────────────────────────
const S = {
  clients: [],
  sel: null,       // selected client id
  open: null,      // expanded stage id
  gToken: null,
  editId: null,    // id being edited in modal
};

let _uploadStage = null;

// ── PERSISTENCE ─────────────────────────────────────────────────────────────
const STORE_KEY = 'wl_v1';
function save() { localStorage.setItem(STORE_KEY, JSON.stringify({ clients: S.clients })); }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    S.clients = d.clients || [];
  } catch {}
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function uid() {
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}
function initStages() {
  const o = {};
  STAGES.forEach(s => { o[s.id] = { status: 'pending', start: '', end: '', notes: '', files: [] }; });
  return o;
}
function initials(n) { return n.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase(); }
function fdate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('pt-BR'); }
function fsize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
function today() { return new Date().toISOString().split('T')[0]; }

function pct(c) {
  const s = STAGES.map(st => c.stages[st.id].status);
  const done = s.filter(x => x === 'completed').length;
  const act  = s.some(x => x === 'active') ? 0.5 : 0;
  return Math.round(((done + act) / STAGES.length) * 100);
}

function currentStage(c) {
  let last = null;
  for (const st of STAGES) {
    const s = c.stages[st.id];
    if (s.status === 'active') return st;
    if (s.status === 'completed') last = st;
  }
  return last || STAGES[0];
}

// ── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = (type === 'ok' ? '✓ ' : '✕ ') + msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

// ── OVERLAY ──────────────────────────────────────────────────────────────────
function openOverlay(id) { document.getElementById(id).classList.add('on'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('on'); }
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('on'); }));

// ── CLIENT CRUD ──────────────────────────────────────────────────────────────
function saveClient() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { toast('Informe o nome do cliente', 'err'); return; }

  if (S.editId) {
    const c = S.clients.find(x => x.id === S.editId);
    if (c) {
      c.name  = name;
      c.co    = document.getElementById('fCo').value.trim();
      c.proj  = document.getElementById('fProj').value.trim();
      c.owner = document.getElementById('fOwner').value.trim();
      c.email = document.getElementById('fEmail').value.trim();
    }
    S.editId = null;
    toast('Cliente atualizado');
  } else {
    const c = {
      id: uid(), name,
      co:    document.getElementById('fCo').value.trim(),
      proj:  document.getElementById('fProj').value.trim(),
      owner: document.getElementById('fOwner').value.trim(),
      email: document.getElementById('fEmail').value.trim(),
      created: today(),
      stages: initStages(),
    };
    S.clients.unshift(c);
    S.sel = c.id;
    toast(`"${name}" criado`);
  }
  save(); clearForm(); closeOverlay('oNew');
  renderAll();
}

function clearForm() {
  ['fName','fCo','fProj','fOwner','fEmail'].forEach(id => document.getElementById(id).value = '');
}

function openEdit(id) {
  const c = S.clients.find(x => x.id === id);
  if (!c) return;
  S.editId = id;
  document.getElementById('modalTitle').textContent = 'Editar Cliente';
  document.getElementById('modalSaveBtn').textContent = 'Salvar Alterações';
  document.getElementById('fName').value  = c.name;
  document.getElementById('fCo').value    = c.co || '';
  document.getElementById('fProj').value  = c.proj || '';
  document.getElementById('fOwner').value = c.owner || '';
  document.getElementById('fEmail').value = c.email || '';
  openOverlay('oNew');
}

// Reset modal for new client when closed
document.getElementById('oNew').addEventListener('click', () => {
  if (!document.getElementById('oNew').classList.contains('on')) resetModal();
});
document.querySelector('#oNew .btn-x').addEventListener('click', resetModal);
document.querySelector('#oNew .btn-cancel').addEventListener('click', resetModal);
function resetModal() {
  S.editId = null;
  document.getElementById('modalTitle').textContent = 'Novo Cliente';
  document.getElementById('modalSaveBtn').textContent = 'Criar Cliente';
  clearForm();
}

function selectClient(id) { S.sel = id; S.open = null; renderAll(); }
function filterClients(q) { renderSidebar(q); }

// ── RENDER: SIDEBAR ──────────────────────────────────────────────────────────
function renderSidebar(q = '') {
  const list = document.getElementById('cList');
  const lc = q.toLowerCase();
  const filtered = S.clients.filter(c =>
    c.name.toLowerCase().includes(lc) || (c.co||'').toLowerCase().includes(lc)
  );

  if (!filtered.length) {
    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-3);font-size:12px;">Nenhum resultado</div>`;
    return;
  }

  list.innerHTML = filtered.map(c => {
    const progress = STAGES.map(st => c.stages[st.id].status);
    const hasActv  = progress.some(x => x === 'active');
    const allDone  = progress.every(x => x === 'completed');
    const cur      = currentStage(c);

    let bc = 'b-pend', bt = cur ? cur.label : 'Início';
    if (hasActv) bc = 'b-actv';
    if (allDone) { bc = 'b-done'; bt = 'Concluído ✓'; }

    return `
      <div class="c-item ${S.sel === c.id ? 'sel' : ''}" onclick="selectClient('${c.id}')">
        <div class="c-name">${c.name}</div>
        ${c.co ? `<div class="c-co">${c.co}</div>` : ''}
        <div class="c-badge ${bc}">${bt}</div>
      </div>`;
  }).join('');
}

// ── RENDER: MAIN ─────────────────────────────────────────────────────────────
function renderMain() {
  const main = document.getElementById('main');
  if (!S.sel) { renderDashboard(); return; }
  const c = S.clients.find(x => x.id === S.sel);
  if (!c) { renderDashboard(); return; }

  const progress  = STAGES.map(st => c.stages[st.id].status);
  const pcPct     = pct(c);
  const fillWidth = pcPct;

  main.innerHTML = `
    <div class="detail">

      <!-- Header -->
      <div class="det-head">
        <div>
          <h1>${c.name}</h1>
          <div class="det-meta">
            ${c.co    ? `<div><span>Empresa</span>${c.co}</div>` : ''}
            ${c.proj  ? `<div><span>Projeto</span>${c.proj}</div>` : ''}
            ${c.owner ? `<div><span>Resp.</span>${c.owner}</div>` : ''}
          </div>
        </div>
        <button class="btn-edit" onclick="openEdit('${c.id}')">✏ Editar</button>
      </div>

      <!-- Stats -->
      <div class="stats">
        ${STAGES.map(st => {
          const s = c.stages[st.id];
          const num   = s.status === 'completed' ? '✓' : s.status === 'active' ? '●' : '–';
          const color = s.status === 'completed' ? 'var(--primary)' : s.status === 'active' ? 'var(--amber)' : 'var(--text-3)';
          return `<div class="stat">
            <div class="stat-n" style="color:${color}">${num}</div>
            <div class="stat-l">${st.label}</div>
          </div>`;
        }).join('')}
      </div>

      <!-- Timeline card -->
      <div class="tl-card">
        <div class="tl-card-title">Linha do Tempo · ${pcPct}% concluído</div>
        <div class="timeline">
          <div class="tl-track"><div class="tl-fill" style="width:${fillWidth}%"></div></div>
          <div class="tl-steps">
            ${STAGES.map((st, i) => {
              const s = c.stages[st.id];
              const cls = s.status === 'completed' ? 'done' : s.status === 'active' ? 'actv' : 'pend';
              const ico = s.status === 'completed' ? '✓' : st.icon;
              return `
                <div class="tl-step" onclick="toggleStage('${st.id}')">
                  <div class="tl-circle ${cls}">${ico}</div>
                  <div class="tl-label ${cls}">${st.label}</div>
                </div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <!-- Stage cards -->
      <div class="stages">
        ${STAGES.map(st => renderStageCard(c, st)).join('')}
      </div>

    </div>`;

  setupDropZones();
}

// ── RENDER: STAGE CARD ───────────────────────────────────────────────────────
function renderStageCard(c, st) {
  const s = c.stages[st.id];
  const isOpen = S.open === st.id;
  const sc   = s.status === 'completed' ? 's-done' : s.status === 'active' ? 's-actv' : '';
  const pc   = s.status === 'completed' ? 'p-done' : s.status === 'active' ? 'p-actv' : 'p-pend';
  const pt   = s.status === 'completed' ? '✓ Concluído' : s.status === 'active' ? '● Em Andamento' : '○ Pendente';
  const ic   = s.status === 'completed' ? 'done' : s.status === 'active' ? 'actv' : '';

  const fileListHtml = (s.files && s.files.length) ? `
    <div class="file-list" style="margin-bottom:10px;">
      ${s.files.map((f, fi) => `
        <div class="f-item">
          <div class="f-left">
            <div class="f-ico">${f.type && f.type.includes('image') ? '🖼' : f.type && f.type.includes('pdf') ? '📕' : '📄'}</div>
            <div>
              <div class="f-name">${f.name}</div>
              <div class="f-meta">${f.size || ''}${f.date ? ' · ' + fdate(f.date) : ''}</div>
            </div>
          </div>
          <div class="f-right">
            ${f.driveUrl ? `<a href="${f.driveUrl}" target="_blank" class="btn-drive-link">☁ Drive</a>` : '<span style="font-size:10px;color:var(--text-3)">local</span>'}
            <button class="btn-del" onclick="delFile('${c.id}','${st.id}',${fi})" title="Remover">×</button>
          </div>
        </div>`).join('')}
    </div>` : '';

  const uploadHtml = st.hasUpload ? `
    <div class="upload-sec">
      <div class="upload-ttl">Arquivos de Resposta</div>
      ${fileListHtml}
      <div class="drop" id="drop-${st.id}" onclick="triggerUpload('${st.id}')">
        <div class="drop-ico">📎</div>
        <div class="drop-txt">Clique ou arraste o arquivo aqui</div>
        <div class="drop-hint">PDF · DOCX · XLSX · imagens · máx. 25 MB</div>
      </div>
      <div class="up-bar-wrap" id="upWrap-${st.id}">
        <div class="up-bar-head">
          <span id="upName-${st.id}">Enviando…</span>
          <span id="upPct-${st.id}">0%</span>
        </div>
        <div class="up-bar"><div class="up-bar-fill" id="upBar-${st.id}" style="width:0%"></div></div>
      </div>
    </div>` : (fileListHtml ? `<div class="upload-sec"><div class="upload-ttl">Arquivos</div>${fileListHtml}</div>` : '');

  return `
    <div class="stage ${sc}" id="sc-${st.id}">
      <div class="stage-head" onclick="toggleStage('${st.id}')">
        <div class="stage-lft">
          <div class="stage-ico ${ic}">${st.icon}</div>
          <div>
            <div class="stage-ttl">${st.label}</div>
            <div class="stage-desc">${st.desc}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:9px">
          <span class="pill ${pc}">${pt}</span>
          <span class="chev ${isOpen ? 'open' : ''}">⌄</span>
        </div>
      </div>
      <div class="stage-body ${isOpen ? 'open' : ''}">
        <div class="s-grid">
          <div>
            <label class="lbl">Status</label>
            <select class="sel" onchange="updateField('${c.id}','${st.id}','status',this.value)">
              <option value="pending"   ${s.status==='pending'  ?'selected':''}>Pendente</option>
              <option value="active"    ${s.status==='active'   ?'selected':''}>Em Andamento</option>
              <option value="completed" ${s.status==='completed'?'selected':''}>Concluído</option>
            </select>
          </div>
          <div>
            <label class="lbl">Data de Início</label>
            <input type="date" class="inp" value="${s.start}" onchange="updateField('${c.id}','${st.id}','start',this.value)">
          </div>
          <div>
            <label class="lbl">Data de Conclusão</label>
            <input type="date" class="inp" value="${s.end}" onchange="updateField('${c.id}','${st.id}','end',this.value)">
          </div>
          <div></div>
          <div class="s-full">
            <label class="lbl">Observações</label>
            <textarea class="ta" placeholder="Notas sobre esta etapa…" onchange="updateField('${c.id}','${st.id}','notes',this.value)">${s.notes||''}</textarea>
          </div>
        </div>
        ${uploadHtml}
      </div>
    </div>`;
}

// ── RENDER: DASHBOARD ────────────────────────────────────────────────────────
function renderDashboard() {
  const main  = document.getElementById('main');
  const total = S.clients.length;

  if (!total) {
    main.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📋</div>
        <h2>Nenhum cliente ainda</h2>
        <p>Clique em <strong>Novo Cliente</strong> na barra lateral para começar a controlar o workflow de feedback.</p>
      </div>`;
    return;
  }

  const byStage = {};
  STAGES.forEach(st => { byStage[st.id] = 0; });
  S.clients.forEach(c => STAGES.forEach(st => { if (c.stages[st.id].status === 'active') byStage[st.id]++; }));

  main.innerHTML = `
    <div class="dashboard">
      <div class="dash-title">Visão Geral · ${total} cliente${total !== 1 ? 's' : ''}</div>
      <div class="dash-stats">
        ${STAGES.map(st => `
          <div class="ds-card">
            <div class="ds-ico">${st.icon}</div>
            <div class="ds-num">${byStage[st.id]}</div>
            <div class="ds-lbl">${st.label}</div>
          </div>`).join('')}
      </div>
      <div class="client-grid">
        ${S.clients.map(c => {
          const progress = STAGES.map(st => c.stages[st.id].status);
          const cur = currentStage(c);
          return `
            <div class="c-card" onclick="selectClient('${c.id}')">
              <div class="c-card-top">
                <div class="c-avatar">${initials(c.name)}</div>
                <div>
                  <div class="c-card-n">${c.name}</div>
                  <div class="c-card-co">${c.co || c.proj || 'Cliente'}</div>
                </div>
              </div>
              <div class="mini-tl">
                ${progress.map(st => `<div class="mini-s ${st === 'completed' ? 'done' : st === 'active' ? 'actv' : ''}"></div>`).join('')}
              </div>
              <div class="c-card-foot">
                <span class="c-card-stage">${cur ? cur.label : '—'}</span>
                <span class="c-card-pct">${pct(c)}%</span>
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

// ── HELPERS: RENDER ──────────────────────────────────────────────────────────
function renderAll() { renderSidebar(); renderMain(); }

// ── STAGE INTERACTIONS ───────────────────────────────────────────────────────
function toggleStage(id) { S.open = S.open === id ? null : id; renderMain(); }

function updateField(cid, sid, field, val) {
  const c = S.clients.find(x => x.id === cid);
  if (!c) return;
  c.stages[sid][field] = val;
  if (field === 'status') {
    if (val === 'active'    && !c.stages[sid].start) c.stages[sid].start = today();
    if (val === 'completed' && !c.stages[sid].end)   c.stages[sid].end   = today();
  }
  save();
  renderSidebar(document.getElementById('srch').value);
  // Re-render just the stage card & stats without collapsing the open stage
  const cur = S.open;
  renderMain();
  S.open = cur; // keep open
}

function delFile(cid, sid, idx) {
  const c = S.clients.find(x => x.id === cid);
  if (!c) return;
  c.stages[sid].files.splice(idx, 1);
  save(); renderMain(); toast('Arquivo removido');
}

// ── FILE UPLOAD ──────────────────────────────────────────────────────────────
function triggerUpload(sid) { _uploadStage = sid; document.getElementById('fileInput').click(); }

function onFilesPicked(e) {
  Array.from(e.target.files).forEach(f => handleFile(f));
  e.target.value = '';
}

async function handleFile(file) {
  const sid = _uploadStage;
  const cid = S.sel;
  const c   = S.clients.find(x => x.id === cid);
  if (!c || !sid) return;

  const entry = { id: uid(), name: file.name, size: fsize(file.size), type: file.type, date: today(), driveUrl: null, driveId: null };

  if (S.gToken) {
    try {
      showBar(sid, file.name, 0);
      const res = await driveUpload(file, p => showBar(sid, file.name, p));
      entry.driveId  = res.id;
      entry.driveUrl = `https://drive.google.com/file/d/${res.id}/view`;
      hideBar(sid);
      toast(`"${file.name}" enviado ao Drive`);
    } catch (err) {
      hideBar(sid);
      toast('Erro no upload: ' + err.message, 'err');
    }
  } else {
    toast(`"${file.name}" registrado (conecte o Drive para upload na nuvem)`);
  }

  c.stages[sid].files.push(entry);
  save(); renderMain();
}

function showBar(sid, name, p) {
  const w = document.getElementById(`upWrap-${sid}`);
  if (!w) return;
  w.style.display = 'block';
  document.getElementById(`upName-${sid}`).textContent = name;
  document.getElementById(`upPct-${sid}`).textContent  = Math.round(p) + '%';
  document.getElementById(`upBar-${sid}`).style.width  = p + '%';
}
function hideBar(sid) {
  const w = document.getElementById(`upWrap-${sid}`);
  if (w) w.style.display = 'none';
}

function setupDropZones() {
  document.querySelectorAll('.drop').forEach(z => {
    const sid = z.id.replace('drop-', '');
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', e => {
      e.preventDefault(); z.classList.remove('over');
      _uploadStage = sid;
      Array.from(e.dataTransfer.files).forEach(f => handleFile(f));
    });
  });
}

// ── GOOGLE DRIVE UPLOAD ──────────────────────────────────────────────────────
function driveUpload(file, onPct) {
  const meta = { name: file.name, mimeType: file.type || 'application/octet-stream' };
  if (G_FOLDER_ID) meta.parents = [G_FOLDER_ID];

  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  form.append('file', file);

  return new Promise((ok, fail) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id');
    xhr.setRequestHeader('Authorization', 'Bearer ' + S.gToken);
    xhr.upload.onprogress = e => { if (e.lengthComputable) onPct(e.loaded / e.total * 100); };
    xhr.onload = () => xhr.status < 300 ? ok(JSON.parse(xhr.responseText)) : fail(new Error(xhr.status + ' ' + xhr.responseText));
    xhr.onerror = () => fail(new Error('Falha de rede'));
    xhr.send(form);
  });
}

// ── GOOGLE AUTH ──────────────────────────────────────────────────────────────
let _tokenClient;

function initGAuth() {
  if (!window.google || G_CLIENT_ID.includes('YOUR_')) return;
  _tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: G_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.file',
    callback: r => {
      if (r.error) { toast('Falha na autenticação Google', 'err'); return; }
      S.gToken = r.access_token;
      setGUI(true);
      toast('Google Drive conectado!');
    },
  });
}

function handleGAuth() {
  if (S.gToken) {
    if (window.google) google.accounts.oauth2.revoke(S.gToken, () => {});
    S.gToken = null; setGUI(false); toast('Google Drive desconectado');
    return;
  }
  if (!_tokenClient) { toast('Configure o G_CLIENT_ID no código-fonte para ativar o Drive', 'err'); return; }
  _tokenClient.requestAccessToken({ prompt: 'consent' });
}

function setGUI(on) {
  document.getElementById('btnGdrive').classList.toggle('ok', on);
  document.getElementById('gdot').classList.toggle('on', on);
  document.getElementById('gLabel').textContent = on ? 'Drive Conectado' : 'Conectar Google Drive';
}

window.addEventListener('load', () => { setTimeout(initGAuth, 1500); });

// ── BOOT ─────────────────────────────────────────────────────────────────────
load();
renderAll();
</script>
</body>
